[workspace]
members = [".", "python"]

[package]
name = "pinakes"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Turn declared documentation sources into a reproducible, measured corpus"
readme = "README.md"
keywords = ["documentation", "corpus", "retrieval", "rag"]
categories = ["command-line-utilities"]

[lib]
name = "pinakes"
path = "src/lib.rs"

[[bin]]
name = "pinakes"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
globset = "0.4.20"
jiff = "0.2.37"
regex = "1.13.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tantivy = "0.26.2"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.20"
ureq = { version = "3.4.2", features = ["json"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
