name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag, Cargo.toml and python/Cargo.toml must name the same version, and
  # python/pyproject.toml must take its version from python/Cargo.toml (`dynamic`), so a wheel
  # built from this tag reports the release it came from.
  versions:
    name: versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag with the crate and wheel versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          wheel="$(sed -n 's/^version *= *"\(.*\)"/\1/p' python/Cargo.toml | head -n 1)"
          echo "tag=$tag crate=$crate wheel=$wheel"
          if [ -z "$crate" ] || [ -z "$wheel" ]; then
            echo "::error::could not read the version from Cargo.toml or python/Cargo.toml"
            exit 1
          fi
          if [ "$tag" != "$crate" ] || [ "$tag" != "$wheel" ]; then
            echo "::error::tag v$tag, Cargo.toml $crate and python/Cargo.toml $wheel disagree"
            exit 1
          fi
          if grep -Eq '^version *=' python/pyproject.toml; then
            echo "::error::python/pyproject.toml pins a version; it must use dynamic = [\"version\"]"
            exit 1
          fi
          if ! grep -Eq '^dynamic *= *\[ *"version" *\]' python/pyproject.toml; then
            echo "::error::python/pyproject.toml must declare dynamic = [\"version\"]"
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # `cross` builds the musl and aarch64 Linux targets in containers that carry the
      # matching C toolchain, which the native-code dependencies (ring, zstd) need.
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="pinakes-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/pinakes" README.md LICENSE SPEC.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          echo "asset=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  # Python wheel (python/, SPEC §17.2): PyO3/maturin-action builds the abi3 extension module
  # for the two Linux targets (through a manylinux container - QEMU-emulated for aarch64 on the
  # x86_64 runner) and for Apple silicon macOS, matching pinakes.Index to the CLI's own index.
  python-wheels:
    name: python wheel (${{ matrix.target }})
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: auto
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: auto
          - target: aarch64-apple-darwin
            os: macos-latest
            manylinux: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.target }}
          workspaces: python -> ../target
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          # ring's ARM assembly needs the architecture macro when built inside the
          # QEMU-emulated manylinux container; ignored on every other target.
          CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --manifest-path python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: release
    needs: [build, python-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum ./pinakes-*.tar.gz ./*.whl > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/pinakes-*.tar.gz
            dist/*.whl
            dist/SHA256SUMS
          generate_release_notes: true

  # Force-update the moving major tag (SPEC §17.1) once the release's assets are up, so
  # `uses: friedrichwilken/pinakes@v1` always resolves to the newest v1.x.y release. Only for
  # v1.x.y tags: a hypothetical v2 series would need its own moving tag, not this one.
  update-major-tag:
    name: update major tag
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'v1.')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Force-update v1 to this release
        run: |
          git tag -f v1
          git push -f origin v1

  # Publishing to crates.io is deliberately not wired up. To enable it, add a
  # CARGO_REGISTRY_TOKEN repository secret and uncomment this job.
  #
  # publish:
  #   name: publish (crates.io)
  #   needs: release
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: dtolnay/rust-toolchain@stable
  #     - run: cargo publish --locked
  #       env:
  #         CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Publishing the wheel to PyPI is deliberately not wired up either. To enable it, add a
  # MATURIN_PYPI_TOKEN repository secret (a PyPI API token) and uncomment this job.
  #
  # publish-python:
  #   name: publish (PyPI)
  #   needs: release
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: PyO3/maturin-action@v1
  #       with:
  #         command: publish
  #         args: --manifest-path python/Cargo.toml --skip-existing
  #       env:
  #         MATURIN_PYPI_TOKEN: ${{ secrets.MATURIN_PYPI_TOKEN }}
